<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张依婷的规范场论 · 交互诗篇</title>
<meta name="description" content="一首用规范场论写的情诗 — 当杨-米尔斯理论遇见浪漫。献给张依婷。">
<meta property="og:title" content="张依婷的规范场论">
<meta property="og:description" content="用希格斯机制、规范变换、自发对称破缺写一首情诗。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0812">

<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --rose-gold: #e0a8c0;
  --warm-gold: #f0d4a0;
  --cream: #f5ede0;
  --text-dark: #3a2a1a;
  --text-medium: #6a5540;
  --night: #0a0812;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; }

body {
  background: linear-gradient(180deg, #0a0812 0%, #100d1a 30%, #151022 60%, #100d1a 100%);
  color: var(--cream);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Canvas Layers ── */
canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
#particle-canvas { z-index: 0; }
#heart-canvas { z-index: 999; opacity: 1; transition: opacity 0.6s ease; pointer-events: none; }
#heart-canvas.hidden { opacity: 0; }

/* ── Progress Bar ── */
.progress-bar {
  position: fixed; top: 0; left: 0; height: 2px;
  background: linear-gradient(90deg, var(--rose-gold), var(--warm-gold));
  z-index: 1000; transition: width 0.1s linear;
  box-shadow: 0 0 6px rgba(224, 168, 192, 0.3);
}

/* ── Main Container ── */
.container {
  position: relative; z-index: 10;
  max-width: 700px; margin: 0 auto;
  padding: 120px 30px 80px;
  transition: opacity 1.2s ease, transform 1.2s ease;
}
.container.dissolving { opacity: 0; transform: scale(0.96); pointer-events: none; }

/* ── Hero ── */
.hero {
  text-align: center; padding: 40px 0 30px;
  animation: heroIn 2s ease-out;
}
@keyframes heroIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.hero-title {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(2.2rem, 6vw, 3.5rem);
  color: var(--warm-gold);
  text-shadow: 0 0 35px rgba(240, 212, 160, 0.3), 0 0 70px rgba(240, 212, 160, 0.1);
  letter-spacing: 6px; line-height: 1.5;
  animation: titleGlow 5s ease-in-out infinite 2s;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 25px rgba(240, 212, 160, 0.25); }
  50% { text-shadow: 0 0 45px rgba(240, 212, 160, 0.5), 0 0 80px rgba(224, 168, 192, 0.2); }
}
.hero-subtitle {
  font-size: 0.85rem; color: var(--rose-gold); letter-spacing: 5px;
  margin-top: 10px; opacity: 0.6; font-weight: 300;
}

/* ── Paper Container ── */
.poem-paper {
  margin-top: 40px; padding: clamp(32px, 5vw, 55px) clamp(24px, 4vw, 45px);
  background:
    repeating-linear-gradient(0deg, transparent, transparent 30px,
      rgba(200, 180, 160, 0.04) 30px, rgba(200, 180, 160, 0.04) 31px),
    linear-gradient(180deg, #faf5ef 0%, #f5ede0 50%, #faf5ef 100%);
  border-radius: 4px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.5), 0 0 0 1px rgba(224,168,192,0.1);
  position: relative;
  color: var(--text-dark);
  line-height: 2.4;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(1rem, 2.5vw, 1.25rem);
  overflow: hidden;
  transition: opacity 1.8s ease, transform 1.8s ease;
}
.poem-paper::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(224,168,192,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(240,212,160,0.05) 0%, transparent 50%);
  pointer-events: none; z-index: 1;
}

/* ── Stanza ── */
.stanza { position: relative; z-index: 2; margin-bottom: 36px; text-align: center; }
.stanza p { margin: 4px 0; letter-spacing: 1px; }
.stanza-num {
  display: block; font-family: 'Noto Serif SC', serif;
  font-size: 0.62rem; color: var(--rose-gold); opacity: 0.4;
  letter-spacing: 3px; margin-bottom: 8px;
}

/* ── Typewriter Cursor ── */
.typewriter-cursor {
  display: inline-block; width: 2px; height: 1.2em;
  background: var(--text-dark); vertical-align: text-bottom;
  margin-left: 1px; animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.typewriter-cursor.hidden { display: none; }

/* ── Highlighted Terms ── */
.hl { cursor: pointer; border-bottom: 1px dotted rgba(180, 130, 100, 0.35);
  transition: all 0.3s ease; position: relative; }
.hl-gold { color: #b8860b; font-weight: 600; }
.hl-blue { color: #6a8faa; font-weight: 500; }
.hl-rose { color: #b8647a; font-weight: 600; }
.hl:hover { border-bottom-color: var(--rose-gold); }

/* ── Formula ── */
.formula-inline { display: inline; }
.formula-inline .katex { font-size: 0.88em; color: #6a8faa; }
.formula-block { display: block; margin: 10px auto; text-align: center; }
.formula-block .katex { font-size: 1.02em; color: #5a7090; }

/* ── Heart Reveal Overlay ── */
.heart-reveal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 998; display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
}
.heart-reveal-overlay.active { opacity: 1; }
.heart-reveal-message {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(2rem, 5vw, 3rem);
  color: var(--warm-gold);
  text-shadow: 0 0 30px rgba(240,212,160,0.4);
  letter-spacing: 3px; text-align: center;
  opacity: 0; transform: translateY(20px);
  transition: opacity 1s ease 0.8s, transform 1s ease 0.8s;
  z-index: 1001;
}
.heart-reveal-overlay.active .heart-reveal-message { opacity: 1; transform: translateY(0); }

/* ── Climax Button ── */
.climax-section {
  text-align: center; margin-top: 40px; position: relative; z-index: 2;
  transition: opacity 0.8s ease;
}
.climax-hint {
  font-size: 0.85rem; color: var(--text-medium); opacity: 0.4;
  margin-bottom: 22px; letter-spacing: 2px; font-family: 'Noto Serif SC', serif;
}
.heart-btn {
  padding: 12px 38px; border-radius: 50px;
  background: transparent; border: 1px solid rgba(184, 100, 122, 0.35);
  color: #b8647a; font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem; letter-spacing: 2px; cursor: pointer;
  transition: all 0.5s ease; position: relative; z-index: 12;
}
.heart-btn:hover {
  background: rgba(184, 100, 122, 0.1); border-color: #b8647a;
  box-shadow: 0 0 25px rgba(184, 100, 122, 0.2);
}
.heart-btn.triggered {
  border-color: #b8647a; background: rgba(184, 100, 122, 0.15);
  pointer-events: none; opacity: 0.5;
}

/* ── Signature ── */
.signature-section {
  text-align: center; margin-top: 48px; position: relative; z-index: 2;
}
.signature-line {
  width: 100px; height: 1px; background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
  margin: 0 auto 20px;
}
.signature { font-size: 1.4rem; color: #b8860b; letter-spacing: 3px; }

/* ── Footer ── */
.footer-section {
  text-align: center; margin-top: 50px; position: relative; z-index: 12;
}
.footer-actions {
  display: flex; justify-content: center; gap: 16px; margin-bottom: 30px; flex-wrap: wrap;
}
.footer-btn {
  padding: 10px 24px; border-radius: 50px; font-size: 0.82rem; letter-spacing: 2px;
  cursor: pointer; transition: all 0.35s ease; font-family: 'Noto Serif SC', serif;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(240,212,160,0.15);
  color: rgba(245, 237, 224, 0.5); position: relative; z-index: 12;
}
.footer-btn:hover { border-color: var(--warm-gold); color: var(--cream); background: rgba(240,212,160,0.06); }
.footer-btn.copied { border-color: var(--warm-gold); color: var(--warm-gold); }
.footer-deco { opacity: 0.3; margin-top: 20px; }
.footer-deco svg { width: 32px; height: 32px; fill: var(--warm-gold); }
.footer-credit { font-size: 0.7rem; color: rgba(245,237,224,0.3); margin-top: 14px; letter-spacing: 1px; font-family: 'Noto Serif SC', serif; }

/* ── Tooltip ── */
.term-tooltip {
  position: fixed; z-index: 2000; pointer-events: none;
  background: rgba(30, 22, 20, 0.97); border: 1px solid rgba(240,212,160,0.3);
  border-radius: 10px; padding: 12px 18px; max-width: 260px;
  font-size: 0.8rem; line-height: 1.7; color: var(--cream);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  font-family: 'Noto Serif SC', serif;
}
.term-tooltip.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
.term-tooltip .tt-title { color: var(--warm-gold); font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,22,20,0.95); border: 1px solid var(--warm-gold);
  border-radius: 50px; padding: 12px 28px; color: var(--warm-gold);
  font-size: 0.85rem; letter-spacing: 2px; z-index: 3000; opacity: 0;
  transition: all 0.4s ease; pointer-events: none; font-family: 'Noto Serif SC', serif;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .container { padding: 80px 16px 60px; }
  .poem-paper { padding: 28px 20px; border-radius: 3px; }
  .stanza { margin-bottom: 28px; }
}
@media (max-width: 480px) {
  .container { padding: 60px 10px 40px; }
  .hero-title { letter-spacing: 3px; }
  .hero-subtitle { font-size: 0.72rem; letter-spacing: 3px; }
  .poem-paper { padding: 22px 16px; font-size: 0.95rem; line-height: 2.2; }
  .stanza { margin-bottom: 22px; }
  .footer-actions { gap: 10px; }
  .footer-btn { padding: 8px 16px; font-size: 0.72rem; }
}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<canvas id="heart-canvas"></canvas>

<!-- Heart Reveal Overlay -->
<div class="heart-reveal-overlay" id="heart-overlay">
  <div class="heart-reveal-message" id="heart-message">爱是不变质量</div>
</div>

<div class="progress-bar" id="progress-bar"></div>

<div class="container" id="main-container">

  <!-- Hero -->
  <section class="hero">
    <h1 class="hero-title">张依婷的规范场论</h1>
    <p class="hero-subtitle">GAUGE THEORY OF LOVE</p>
  </section>

  <!-- Poem Paper -->
  <div class="poem-paper" id="poem-paper">

    <div class="stanza" id="stanza-1" data-raw='<span class="stanza-num">I · 对称性自发破缺</span>\n<p>在遇到你之前，我的<span class="hl hl-gold" data-term="gauge-field">规范场</span>无质量，</p>\n<p>所有粒子都以<span class="hl hl-blue" data-term="light-speed">光速</span>疾驰，</p>\n<p>没有停驻的理由。</p>\n<p>直到你张开<span class="hl hl-gold" data-term="higgs-field">希格斯场</span>的势能</p>\n<p class="formula-block"><katex>V(\\phi)=\\mu^2\\phi^\\dagger\\phi+\\lambda(\\phi^\\dagger\\phi)^2</katex></p>\n<p>对称性突然<span class="hl hl-gold" data-term="symmetry-breaking">自发破缺</span>了——</p>\n<p>真空期待值不再为零 <span class="formula-inline"><katex inline>\\langle\\phi\\rangle \\neq 0</katex></span>。</p>'></div>

    <div class="stanza" id="stanza-2" data-raw='<span class="stanza-num">II · 戈德斯通模式</span>\n<p>你依稀是那个<span class="hl hl-gold" data-term="ground-state">非零的基态</span>选择，</p>\n<p>让我咽下<span class="hl hl-blue" data-term="goldstone">戈德斯通玻色子</span>，</p>\n<p>骤然获得了<span class="hl hl-gold" data-term="inertia">惯性</span>、<span class="hl hl-gold" data-term="weight">重量</span>，</p>\n<p>以及思念的静能 <span class="formula-inline"><katex inline>E = mc^2</katex></span>。</p>'></div>

    <div class="stanza" id="stanza-3" data-raw='<span class="stanza-num">III · 规范群破缺</span>\n<p><span class="hl hl-rose">婷婷</span>于二重态的唯一方向，</p>\n<p>你破缺了我全部的孤立对称群</p>\n<p class="formula-block"><katex>SU(2)_L \\times U(1)_Y</katex></p>'></div>

    <div class="stanza" id="stanza-4" data-raw='<span class="stanza-num">IV · 质量生成</span>\n<p>于是，传递弱作用的<span class="hl hl-blue" data-term="w-boson">中间玻色子</span></p>\n<p>变得沉重，</p>\n<p>一如我<span class="hl hl-gold" data-term="heartbeat">沉甸甸的心跳</span>。</p>'></div>

    <div class="stanza" id="stanza-5" data-raw='<span class="stanza-num">V · 不变质量</span>\n<p>我们之间，从此有了</p>\n<p><span class="hl hl-gold" data-term="invariant-mass">不变质量</span> <span class="formula-inline"><katex inline>\\sqrt{p^\\mu p_\\mu} \\neq 0</katex></span>，</p>\n<p>在每一次<span class="hl hl-blue" data-term="gauge-transform">规范变换</span>下</p>\n<p>都不再虚无。</p>'></div>

    <div class="stanza" id="stanza-6" data-raw='<span class="stanza-num">VI · 希格斯机制</span>\n<p><span class="hl hl-rose" style="font-size:1.25em">张依婷，</span></p>\n<p>你就是我的<span class="hl hl-gold" data-term="higgs-mechanism">希格斯机制</span>——</p>\n<p>让原本冰冷的<span class="hl hl-blue" data-term="quantum-fluctuation">量子涨落</span>，</p>\n<p>凝结出爱情的<span class="hl hl-rose">不变质量</span>。</p>'></div>

    <!-- Heart Button -->
    <div class="climax-section" id="climax-section">
      <p class="climax-hint">点击下方 · 让粒子凝聚为心</p>
      <button class="heart-btn" id="heart-btn" onclick="triggerHeart()">♥ 对称性破缺 ♥</button>
    </div>

    <!-- Signature -->
    <div class="signature-section" id="signature-section">
      <div class="signature-line"></div>
      <p class="signature">献给张依婷</p>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer-section">
    <div class="footer-actions">
      <button class="footer-btn" onclick="copyPoem()" id="copy-btn">复制诗句</button>
      <button class="footer-btn" onclick="sharePoem()">分享链接</button>
    </div>
    <div class="footer-deco">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <p class="footer-credit">杨-米尔斯规范场论 · 希格斯机制 · 献给婷婷</p>
  </div>

</div>

<!-- Tooltip -->
<div class="term-tooltip" id="term-tooltip"></div>
<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═════════════════════════════════════════════
   State
   ═════════════════════════════════════════════ */
var state = {
  typing: false,
  currentStanza: 0,
  typewriterQueue: [],
  cursorEl: null,
  heartActive: false,
  conProgress: 0,
  heartTime: 0,
  constellationStars: [],
  sparkles: [],
  stars: [],
};

/* ═════════════════════════════════════════════
   Utility
   ═════════════════════════════════════════════ */
function rand(a,b) { return Math.random()*(b-a)+a; }
function randInt(a,b) { return Math.floor(rand(a,b+1)); }

/* ═════════════════════════════════════════════
   Particle Canvas
   ═════════════════════════════════════════════ */
var pCanvas = document.getElementById('particle-canvas');
var pCtx = pCanvas.getContext('2d');
var PW, PH, particles = [];

function pResize() { PW = pCanvas.width = window.innerWidth; PH = pCanvas.height = window.innerHeight; }

function ParticleItem() {
  this.reset = function() {
    this.x = Math.random()*PW;
    this.y = PH + 10;
    this.size = rand(1, 2.8);
    this.speedY = rand(-0.3, -0.8);
    this.speedX = rand(-0.15, 0.15);
    this.opacity = rand(0.12, 0.35);
    this.wobbleA = rand(0.3, 1);
    this.wobbleS = rand(0.005, 0.018);
    this.wobbleO = Math.random()*Math.PI*2;
    this.life = 0;
  };
  this.reset();
  this.update = function() {
    this.life++;
    this.x += this.speedX + Math.sin(this.life*this.wobbleS+this.wobbleO)*this.wobbleA*0.08;
    this.y += this.speedY;
    if (this.y < -10 || this.x < -10 || this.x > PW+10) this.reset();
  };
  this.draw = function(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = 'hsla(340, 55%, 72%, ' + this.opacity + ')';
    ctx.fill();
  };
}

/* ═════════════════════════════════════════════
   Heart Canvas + Constellation
   ═════════════════════════════════════════════ */
var hCanvas = document.getElementById('heart-canvas');
var hCtx = hCanvas.getContext('2d');
var HW, HH;

function hResize() { HW = hCanvas.width = window.innerWidth; HH = hCanvas.height = window.innerHeight; }

function StarItem() {
  this.x = Math.random()*HW;
  this.y = Math.random()*HH;
  this.size = rand(0.4, 2.2);
  this.baseOp = rand(0.2, 0.8);
  this.twinkleS = rand(0.008, 0.03);
  this.twinkleO = Math.random()*Math.PI*2;
  this.constellation = false;
}

function SparkleItem(x, y) {
  this.x = x + rand(-25,25);
  this.y = y + rand(-25,25);
  this.size = rand(0.8, 2.5);
  this.life = 0;
  this.maxLife = rand(25, 50);
  this.sx = rand(-0.4, 0.4);
  this.sy = rand(-0.4, 0.4);
}

function heartPoints(count, cx, cy, scale) {
  var pts = [];
  for (var i = 0; i < count; i++) {
    var t = (i/count)*Math.PI*2;
    var x = 16*Math.pow(Math.sin(t),3);
    var y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    pts.push({ x: cx + x*scale, y: cy + y*scale });
  }
  return pts;
}

function initStars() {
  hResize();
  state.stars = [];
  for (var i = 0; i < 200; i++) state.stars.push(new StarItem());
}

function matchStarsToHeart() {
  var cx = HW/2, cy = HH/2 - 20;
  var scale = Math.min(HW, HH)*0.011;
  var hpts = heartPoints(32, cx, cy, scale);
  state.constellationStars = [];
  hpts.forEach(function(hp) {
    var best = null, bestD = Infinity;
    state.stars.forEach(function(s) {
      var d = Math.hypot(s.x - hp.x, s.y - hp.y);
      if (d < bestD) { bestD = d; best = s; }
    });
    if (best) { best.constellation = true; state.constellationStars.push(best); }
  });
}

/* ═════════════════════════════════════════════
   Heart Trigger — dissolve paper, reveal heart
   ═════════════════════════════════════════════ */
function triggerHeart() {
  if (state.heartActive) return;
  state.heartActive = true;
  state.conProgress = 0;
  state.heartTime = 0;

  var btn = document.getElementById('heart-btn');
  btn.classList.add('triggered');
  btn.innerHTML = '♥ 爱是不变质量 ♥';

  // Step 1: Init star field
  initStars();

  // Step 2: Start dissolving the paper and container
  document.getElementById('poem-paper').style.opacity = '0';
  document.getElementById('poem-paper').style.transform = 'scale(0.97)';
  document.getElementById('main-container').classList.add('dissolving');

  // Step 3: After dissolve, show heart overlay and draw constellation
  setTimeout(function() {
    document.getElementById('heart-overlay').classList.add('active');
    document.getElementById('heart-canvas').classList.remove('hidden');

    matchStarsToHeart();
    var startT = Date.now(), dur = 3000;
    function anim() {
      var elapsed = Date.now() - startT;
      state.conProgress = Math.min(elapsed/dur, 1);
      if (state.conProgress < 1) requestAnimationFrame(anim);
    }
    anim();
  }, 1400);
}

/* ═════════════════════════════════════════════
   Heart Canvas Animation
   ═════════════════════════════════════════════ */
(function heartLoop() {
  if (state.heartActive) {
    state.heartTime++;
    hCtx.clearRect(0, 0, HW, HH);

    state.stars.forEach(function(s) {
      s.opacity = s.baseOp*(0.6+0.4*Math.sin(state.heartTime*s.twinkleS+s.twinkleO));
      hCtx.beginPath();
      hCtx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      hCtx.fillStyle = 'hsla(40, 40%, 88%, ' + s.opacity + ')';
      hCtx.fill();
      if (s.constellation && s.opacity > 0.4) {
        hCtx.beginPath();
        hCtx.arc(s.x, s.y, s.size*2.5, 0, Math.PI*2);
        hCtx.fillStyle = 'hsla(340, 50%, 75%, ' + (s.opacity*0.12) + ')';
        hCtx.fill();
      }
    });

    var cs = state.constellationStars;
    var lineCount = Math.floor(cs.length*Math.min(state.conProgress,1));
    if (lineCount >= 2) {
      hCtx.strokeStyle = 'rgba(224,168,192,0.3)';
      hCtx.lineWidth = 1.2;
      hCtx.beginPath();
      hCtx.moveTo(cs[0].x, cs[0].y);
      for (var i = 1; i < lineCount; i++) hCtx.lineTo(cs[i].x, cs[i].y);
      if (state.conProgress >= 1 && lineCount >= cs.length) hCtx.lineTo(cs[0].x, cs[0].y);
      hCtx.stroke();
      hCtx.strokeStyle = 'rgba(240,212,160,0.1)';
      hCtx.lineWidth = 4;
      hCtx.stroke();
    }

    // Sparkles
    state.sparkles = state.sparkles.filter(function(sp) { return sp.life < sp.maxLife; });
    state.sparkles.forEach(function(sp) {
      sp.life++; sp.x += sp.sx; sp.y += sp.sy;
      var a = sp.life/sp.maxLife;
      var alpha = a < 0.3 ? a/0.3 : 1-(a-0.3)/0.7;
      if (alpha <= 0) return;
      hCtx.beginPath();
      hCtx.arc(sp.x, sp.y, sp.size*(1-a*0.5), 0, Math.PI*2);
      hCtx.fillStyle = 'rgba(240,212,160,' + (alpha*0.7) + ')';
      hCtx.fill();
    });
    if (state.conProgress > 0 && state.heartTime % 5 === 0 && cs.length > 0) {
      var idx = randInt(0, cs.length-1);
      state.sparkles.push(new SparkleItem(cs[idx].x, cs[idx].y));
    }
  }
  requestAnimationFrame(heartLoop);
})();

/* ═════════════════════════════════════════════
   Particle Animation

(function particleLoop() {
  pCtx.clearRect(0, 0, PW, PH);
  particles.forEach(function(p) { p.update(); p.draw(pCtx); });
  requestAnimationFrame(particleLoop);
})();

/* ═════════════════════════════════════════════
   Typewriter Engine (DOM-based, only visible chars)
   ═════════════════════════════════════════════ */
var TYPING_SPEED_MIN = 22;  // ms per visible character
var TYPING_SPEED_MAX = 48;
var NEWLINE_PAUSE = 100;

function tokenizeHTML(raw) {
  // Parse raw HTML into tokens: 'char' for visible text, 'html' for instant elements
  var div = document.createElement('div');
  div.innerHTML = raw.replace(/\\n/g, '<tw-br>');
  var tokens = [];

  function walk(node) {
    if (node.nodeType === 3) {
      // Text node: each character is a token
      var chars = node.textContent.split('');
      chars.forEach(function(ch) { tokens.push({ type: 'char', char: ch }); });
    } else if (node.nodeType === 1) {
      var tag = node.tagName.toLowerCase();

      if (tag === 'katex') {
        // Render KaTeX formula fully at once
        var formula = node.textContent;
        var inline = node.getAttribute('inline') !== null;
        try {
          var rendered = katex.renderToString(formula, { throwOnError: false, displayMode: !inline });
          tokens.push({ type: 'html', html: rendered });
        } catch(e) {
          tokens.push({ type: 'html', html: '<i>?</i>' });
        }
      } else if (tag === 'tw-br') {
        // Our custom newline marker
        tokens.push({ type: 'html', html: '<br>' });
      } else if (tag === 'br') {
        tokens.push({ type: 'html', html: '<br>' });
      } else {
        // Regular element: emit open tag, walk children, emit close tag
        var openTag = '<' + tag;
        for (var i = 0; i < node.attributes.length; i++) {
          var a = node.attributes[i];
          openTag += ' ' + a.name + '="' + a.value.replace(/"/g, '&quot;') + '"';
        }
        openTag += '>';
        tokens.push({ type: 'html', html: openTag });

        for (var j = 0; j < node.childNodes.length; j++) {
          walk(node.childNodes[j]);
        }

        tokens.push({ type: 'html', html: '</' + tag + '>' });
      }
    }
  }

  for (var k = 0; k < div.childNodes.length; k++) {
    walk(div.childNodes[k]);
  }
  return tokens;
}

function createCursor() {
  var el = document.createElement('span');
  el.className = 'typewriter-cursor';
  return el;
}

function typeStanza(stanzaEl) {
  if (state.typing) return;
  state.typing = true;

  var raw = stanzaEl.getAttribute('data-raw');
  if (!raw) { state.typing = false; return; }

  var tokens = tokenizeHTML(raw);
  var idx = 0;
  var buf = '';

  stanzaEl.innerHTML = '';
  var holder = document.createElement('div');
  holder.style.display = 'inline';
  stanzaEl.appendChild(holder);

  var cursor = createCursor();
  stanzaEl.appendChild(cursor);
  state.cursorEl = cursor;

  function step() {
    if (idx >= tokens.length) {
      // Done — set final state
      cursor.classList.add('hidden');
      state.typing = false;
      // Final render: replace katex tags and clean up
      var finalHtml = raw.replace(/\\n/g, '').replace(/<katex([^>]*)>(.*?)<\/katex>/g, function(m, attrs, f) {
        var il = attrs.indexOf('inline') >= 0;
        try { return katex.renderToString(f, { throwOnError: false, displayMode: !il }); }
        catch(e) { return f; }
      });
      stanzaEl.innerHTML = finalHtml;
      bindTooltipEvents(stanzaEl);
      typeNextStanza();
      return;
    }

    var tok = tokens[idx];
    if (tok.type === 'html') {
      // Insert element HTML immediately (invisible to reader)
      buf += tok.html;
      holder.innerHTML = buf;
      idx++;
      step();  // no delay for HTML elements
    } else {
      // Type one visible character
      buf += tok.char;
      holder.innerHTML = buf;
      idx++;
      setTimeout(step, rand(TYPING_SPEED_MIN, TYPING_SPEED_MAX));
    }
  }

  step();
}

function typeNextStanza() {
  state.currentStanza++;
  var next = document.getElementById('stanza-' + (state.currentStanza + 1));
  if (next && next.getAttribute('data-raw')) {
    setTimeout(function() {
      next.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(function() { typeStanza(next); }, 350);
    }, 500);
  }
}

function bindTooltipEvents(el) {
  el.querySelectorAll('.hl[data-term]').forEach(function(hl) {
    hl.addEventListener('mouseenter', function(e) { showTooltip(e, glossary[hl.dataset.term]); });
    hl.addEventListener('mousemove', function(e) { positionTooltip(e); });
    hl.addEventListener('mouseleave', hideTooltip);
    hl.addEventListener('click', function(e) {
      var t = glossary[hl.dataset.term];
      if (!t) return;
      showTooltip(e, t);
      setTimeout(hideTooltip, 3500);
    });
  });
}

// Start first stanza when it becomes visible
var typeObserver = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting && state.currentStanza === 0 && !state.typing) {
      typeStanza(entry.target);
      typeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.4 });

var s1 = document.getElementById('stanza-1');
if (s1) typeObserver.observe(s1);

var tooltip = document.getElementById('term-tooltip');
var tooltipTimer;

function positionTooltip(e) {
  var x = e.clientX + 14, y = e.clientY - 12;
  var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if (x + tw > window.innerWidth - 12) x = e.clientX - tw - 14;
  if (y + th > window.innerHeight - 12) y = e.clientY - th - 12;
  if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function showTooltip(e, info) {
  if (!info) return;
  tooltip.innerHTML = '<div class="tt-title">' + info[0] + '</div>' + info[1];
  positionTooltip(e);
  tooltip.classList.add('active');
  clearTimeout(tooltipTimer);
}

function hideTooltip() {
  tooltipTimer = setTimeout(function() { tooltip.classList.remove('active'); }, 120);
}

tooltip.addEventListener('mouseenter', function() { clearTimeout(tooltipTimer); tooltip.classList.add('active'); });
tooltip.addEventListener('mouseleave', hideTooltip);
